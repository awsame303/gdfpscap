name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.0.1)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: v
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "building $V"

      - name: Build and test
        run: |
          make VERSION="${{ steps.v.outputs.version }}"
          make test

      - name: Build artifacts
        run: |
          make pkg VERSION="${{ steps.v.outputs.version }}"
          make app VERSION="${{ steps.v.outputs.version }}"

      - name: Name the artifacts
        id: a
        run: |
          V="${{ steps.v.outputs.version }}"
          mkdir -p dist
          cp "build/FPS Uncap.pkg" "dist/FPS-Uncap-$V.pkg"
          # ditto preserves the bundle's symlinks and its ad-hoc signature,
          # which a plain zip does not.
          ditto -c -k --sequesterRsrc --keepParent \
                "build/FPS Uncap.app" "dist/FPS-Uncap-$V-app.zip"
          shasum -a 256 dist/* > "dist/SHA256SUMS.txt"
          cat "dist/SHA256SUMS.txt"

      - name: Release notes
        run: |
          cat > /tmp/notes.md <<'EOF'
          ## Install

          Download **FPS-Uncap-<version>.pkg**, then **right-click it → Open**.

          The package is not signed with an Apple Developer ID, so a plain
          double-click is blocked by Gatekeeper. Right-click → Open once is
          enough.

          The installer runs as root, which is what lets it modify Geometry
          Dash: since macOS Ventura, writing to a file sealed into another
          app's code signature needs App Management permission, and a normal
          double-clicked app is never granted it.

          Open the installer again at any time to change the FPS or uninstall.

          `FPS-Uncap-<version>-app.zip` is the optional settings app.
          EOF
          sed -i '' "s/<version>/${{ steps.v.outputs.version }}/g" /tmp/notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.v.outputs.version }}"
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in v*) ;; *) TAG="v$V";; esac
          # --generate-notes appends the autogenerated changelog to our notes.
          # If this gh build refuses the combination, publish without it rather
          # than failing the release.
          gh release create "$TAG" --title "v$V" \
             --notes-file /tmp/notes.md --generate-notes dist/* \
          || gh release create "$TAG" --title "v$V" \
             --notes-file /tmp/notes.md dist/*
